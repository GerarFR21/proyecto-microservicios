spring.application.name=api-gateway

# Puerto del Gateway
server.port=8081

eureka.instance.prefer-ip-address=true
eureka.instance.ip-address=127.0.0.1
eureka.instance.instance-id=${spring.application.name}:${server.port}

# Conexion al Config Server
spring.config.import=optional:configserver:http://localhost:8888

# Registro en eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka

#Habilitar todos los endpoints de Actuator
management.endpoints.web.exposure.include=*

#Configuracion de rutas para nuestro API-Gateway (WebFlux)
spring.cloud.gateway.server.webflux.routes[0].id=payments
spring.cloud.gateway.server.webflux.routes[0].uri=lb://payments-service
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/payments/**
spring.cloud.gateway.server.webflux.routes[0].filters[0]=StripPrefix=1
